name: Release

on:
  push:
    tags: ['v*']        # e.g. v1.5.0, cut by scripts/release.sh

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; only the release job escalates to
# write (checkout persists the token in the work tree, so the test job should
# never hold one that can create releases).
permissions:
  contents: read

jobs:
  # Gate publication on the test suite: a v* tag can land on a commit CI never
  # saw, and a tag on a broken commit must not publish a release.
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4'
      - name: Test Swift package
        run: swift test -Xswiftc -warnings-as-errors

  # CI publishes unsigned, ad-hoc-signed builds — the same release model as the
  # sibling family apps (maintainer decision, task 062). This repository holds
  # no Developer ID certificate or App Store Connect key, so no signing secrets
  # are read here; users bypass Gatekeeper manually per the release notes.
  release:
    name: Build & publish (unsigned)
    needs: test
    runs-on: macos-15
    permissions:
      contents: write     # needed to create the GitHub Release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after checkout; don't leave the
          # contents:write token sitting in .git/config for the whole build.
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4'

      # Unlike the sibling repos, the version is NOT injected at build time: Sparkle
      # compares the committed build number, and the runbook requires the committed
      # version/build to be exactly what ships. The tag must therefore match the
      # committed MARKETING_VERSION (scripts/release.sh keeps them in step).
      - name: Version from tag must match the committed version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED="$(xcodebuild -project RelayBar.xcodeproj -scheme RelayBar -showBuildSettings 2>/dev/null \
            | awk '/MARKETING_VERSION/{print $3; exit}')"
          if [ "$VERSION" != "$COMMITTED" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match committed MARKETING_VERSION $COMMITTED — cut tags with scripts/release.sh"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # package-release.sh builds through build-app.sh, which signs every Sparkle
      # component inside-out before the outer bundle — ad-hoc here (like the
      # siblings' unsigned builds), since a plain `codesign --deep` on this bundle
      # would leave the nested XPC services with seals the outer signature does
      # not cover. The result runs locally and is what CI publishes; it can never
      # be notarized (notarize-release.sh refuses ad-hoc input outright).
      - name: Build & package (ad-hoc signed)
        env:
          SIGNING_IDENTITY: '-'
        run: ./scripts/package-release.sh
        # package-release.sh writes the archive to the fixed path below (its stdout
        # also carries build-app.sh's signing notices, so it must not be captured
        # as a path — notarize-release.sh relies on the same constant).

      # The asset keeps the runbook-mandated immutable name RelayBarScion.zip
      # (update-appcast.sh derives the enclosure URL from it); the tag path in the
      # download URL provides uniqueness.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: RelayBar Scion ${{ env.VERSION }}
          files: .build/RelayBarScion.zip
          # A pre-release tag (contains a hyphen, e.g. v1.5.0-beta.1) must be marked
          # as a prerelease and NOT made "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          # Published assets are immutable (runbook): on a job re-run the rebuilt
          # archive has different bytes (fresh ad-hoc signatures), and the default
          # overwrite would silently replace the public asset in place. With
          # overwrite off, the re-upload is skipped and the byte-compare below
          # fails closed against the preserved original instead.
          overwrite_files: false
          generate_release_notes: true
          body: |
            ### Unsigned build

            This app is **not** code-signed with a Developer ID or notarized, so macOS
            Gatekeeper will warn on first launch. To open it:

            - **Right-click** (or Control-click) the app → **Open** → **Open**, or
            - run `xattr -dr com.apple.quarantine /Applications/RelayBarScion.app`

      # Never trust an upload: download what GitHub actually serves for the tag
      # and byte-compare it against the archive that was just built.
      - name: Verify the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published" \
            --pattern "RelayBarScion.zip"
          if ! cmp -- .build/RelayBarScion.zip "$RUNNER_TEMP/published/RelayBarScion.zip"; then
            # The published copy provably differs from the built archive: take it
            # down before failing — a corrupt upload must not stay downloadable.
            # (Removing a never-valid upload is damage control, not an in-place
            # replacement; the runbook's immutability rule still forbids uploading
            # different bytes under the same tag — corrections use a higher build.)
            gh release delete-asset "$GITHUB_REF_NAME" "RelayBarScion.zip" -y || true
            echo "::error::published RelayBarScion.zip differed from the built archive and was removed"
            exit 1
          fi

  # Linux tray artifact for the same tag (task 063). Needs the *release* job
  # rather than just the test gate: the release must exist before an asset is
  # uploaded, so this job can only ever attach files, never create anything.
  # The same immutability rules apply — no clobber, byte-compare verification.
  linux-deb:
    name: Build & publish Ubuntu .deb
    needs: [test, release]
    runs-on: ubuntu-22.04
    container: swift:6.0-jammy   # glibc baseline = Ubuntu 22.04
    permissions:
      contents: write     # attaching assets to the existing Release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging and tray system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config \
            libayatana-appindicator3-dev \
            dpkg-dev

      - name: Build & package .deb
        env:
          VERSION: "${GITHUB_REF_NAME#v}"
        run: ./scripts/package-deb.sh

      - name: Publish the .deb to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ".build/relaybar-tray_${GITHUB_REF_NAME#v}_amd64.deb" --clobber=false

      # Mirror of the macOS verify step: never trust the upload.
      - name: Verify the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published" \
            --pattern "*.deb"
          if ! cmp -- ".build/relaybar-tray_${GITHUB_REF_NAME#v}_amd64.deb" \
                      "$RUNNER_TEMP/published/relaybar-tray_${GITHUB_REF_NAME#v}_amd64.deb"; then
            gh release delete-asset "$GITHUB_REF_NAME" \
              "relaybar-tray_${GITHUB_REF_NAME#v}_amd64.deb" -y || true
            echo "::error::published deb differed from the built archive and was removed"
            exit 1
          fi
