name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs: dispatch goes through the API, so CI can be (re-)run without an
  # empty commit even when webhook delivery is throttled.
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run when a *PR branch* is pushed again — but never cancel a
# push to main, or that commit is left with a permanently "cancelled" status (masking
# breakage and putting holes in CI-status bisection).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  registry:
    name: Task-spec registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the task-spec registry
        run: ./scripts/check-task-spec-registry.sh

  test:
    runs-on: macos-15
    timeout-minutes: 45   # a wedged xcodebuild must not burn 6h of 10x-billed macOS runner time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '16.4'   # pin so a runner-image bump can't change the toolchain
      - name: Test Swift package
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build macOS project without signing
        run: >-
          xcodebuild
          -project RelayBar.xcodeproj
          -scheme RelayBar
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
